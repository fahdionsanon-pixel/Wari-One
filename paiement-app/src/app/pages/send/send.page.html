<ion-content [fullscreen]="true" class="send-content">
  <div class="send-wrap">

    <!-- Header -->
    <div class="send-header">
      <button type="button" class="btn-back" routerLink="/home" title="Retour">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1 class="send-title">Envoyer de l'argent</h1>
      <div style="width:44px"></div>
    </div>

    <div class="send-card">
      <p class="send-sub">Indiquez le destinataire, le montant, et confirmez avec votre code PIN.</p>

      <!-- Destinataire -->
      <div class="input-group">
        <label class="input-label" for="toPhone">
          <ion-icon name="person-outline"></ion-icon>
          Numéro du destinataire
        </label>
        <div class="input-row">
          <input
            id="toPhone"
            class="native-input"
            type="tel"
            inputmode="numeric"
            [(ngModel)]="toPhone"
            placeholder="Ex: 22170000000"
            autocomplete="tel"
          />
        </div>
      </div>

      <!-- Montant -->
      <div class="input-group">
        <label class="input-label" for="amount">
          <ion-icon name="cash-outline"></ion-icon>
          Montant (FCFA)
        </label>
        <div class="quick-amounts-grid">
          <button type="button" class="quick-amt-btn"
            *ngFor="let amt of [500, 1000, 2000, 5000, 10000, 25000]"
            [class.selected]="amount === amt"
            (click)="amount = amt">
            {{ amt | number }} F
          </button>
        </div>
        <div class="input-row">
          <input
            id="amount"
            class="native-input"
            type="number"
            inputmode="numeric"
            [(ngModel)]="amount"
            placeholder="Ou saisir un montant..."
            min="1"
          />
          <span class="currency-tag">FCFA</span>
        </div>
      </div>

      <!-- Code PIN -->
      <div class="input-group">
        <label class="input-label" for="pin">
          <ion-icon name="lock-closed-outline"></ion-icon>
          Code PIN de confirmation
        </label>
        <input
          id="pin"
          class="native-input pin-input"
          type="password"
          inputmode="numeric"
          maxlength="4"
          [(ngModel)]="pin"
          placeholder="• • • •"
          (keyup.enter)="send()"
        />
        <p class="pin-hint">Votre PIN est requis pour valider l'envoi.</p>
      </div>

      <!-- Erreur -->
      <div *ngIf="message" class="error-box">
        <ion-icon name="warning-outline"></ion-icon>
        <span>{{ message }}</span>
      </div>

      <!-- Bouton Envoyer -->
      <button
        type="button"
        class="btn-send"
        (click)="send()"
        [disabled]="loading"
      >
        <ion-icon name="paper-plane-outline"></ion-icon>
        {{ loading ? 'Traitement en cours...' : 'Confirmer et envoyer' }}
      </button>
    </div>

  </div>
</ion-content>
