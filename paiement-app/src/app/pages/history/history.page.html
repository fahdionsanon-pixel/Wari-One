<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title class="title-wari">Wari</ion-title>
    <div class="subtitle-wari">Historique</div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [class.ion-padding-horizontal-large]="true">
  <div class="history-wrap">

    <div class="history-header">
      <ion-icon name="time-outline"></ion-icon>
      <span>Mouvements récents</span>
    </div>

    <ion-list class="history-list" *ngIf="transactions.length > 0">
      <ion-item
        *ngFor="let t of transactions"
        class="history-item"
        detail="false"
      >
        <ion-avatar slot="start" [class.avatar-sent]="t.type === 'envoye'" [class.avatar-received]="t.type === 'recu'">
          <ion-icon
            [name]="t.type === 'envoye' ? 'arrow-up-circle' : 'arrow-down-circle'"
          ></ion-icon>
        </ion-avatar>

        <ion-label>
          <h2 class="transaction-title">
            {{ t.type === 'envoye' ? 'Envoyé à' : 'Reçu de' }} {{ t.other }}
          </h2>
          <p class="transaction-date">{{ t.date | date:'dd/MM/yyyy HH:mm' }}</p>
        </ion-label>

        <ion-note slot="end" [class.amount-sent]="t.type === 'envoye'" [class.amount-received]="t.type === 'recu'">
          {{ t.type === 'envoye' ? '-' : '+' }}{{ t.amount }}
        </ion-note>
      </ion-item>
    </ion-list>

    <div class="empty-state" *ngIf="transactions.length === 0 && !message">
      <ion-icon name="document-text-outline" class="empty-icon"></ion-icon>
      <p>Aucune transaction pour le moment</p>
    </div>

    <ion-text color="danger" class="error-msg" *ngIf="message">
      <p>{{ message }}</p>
    </ion-text>

  </div>
</ion-content>
